<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій Плеєр</title>
    <style>
        :root {
            --accent-red: #ff2a4b;
            --accent-red-glow: rgba(255, 42, 75, 0.4);
            --bg-color: #121214;
            --card-bg: #1e1e22;
            --card-hover: #28282e;
        }

        body { 
            font-family: Arial, sans-serif; 
            background: var(--bg-color); 
            color: #fff; 
            text-align: center; 
            padding: 15px; 
        }

        .player-box { 
            max-width: 400px; 
            margin: 0 auto; 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 25px rgba(255, 42, 75, 0.1); 
        }

        .progress-wrapper {
            margin: 20px 0 10px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #cc1133, var(--accent-red));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-red-glow);
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #a0a0ab;
            font-weight: bold;
        }

        .controls { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin: 20px 0; 
        }

        .btn { 
            background: #2a2a2a; 
            color: #fff; 
            border: none; 
            padding: 12px 20px; 
            font-size: 18px; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: 0.2s;
        }

        .btn:hover { background: var(--card-hover); }
        .btn:active { transform: scale(0.95); }

        .btn-main { 
            background: var(--accent-red); 
            color: #fff; 
            font-weight: bold; 
            padding: 14px 24px; 
            font-size: 20px; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px var(--accent-red-glow);
        }

        .btn-main:hover { background: #ff4763; }

        ul { 
            list-style: none; 
            padding: 0; 
            max-height: 350px; 
            overflow-y: auto; 
            text-align: left; 
        }

        li { 
            padding: 14px; 
            background: #2a2a2a; 
            margin-bottom: 8px; 
            border-radius: 10px; 
            cursor: pointer; 
            transition: 0.2s;
        }

        li:hover { background: var(--card-hover); }

        li.active { 
            background: var(--accent-red); 
            color: #fff; 
            font-weight: bold; 
            box-shadow: 0 4px 12px var(--accent-red-glow);
        }
    </style>
</head>
<body>

    <div class="player-box">
        <h2 id="current-title">Мій Плейлист</h2>
        
        <audio id="audio"></audio>

        <div class="progress-wrapper">
            <div class="progress-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="time-display">
                <span id="current-time">0:00</span>
                <span id="duration-time">0:00</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn" id="prev-btn">⏮</button>
            <button class="btn btn-main" id="play-btn">▶</button>
            <button class="btn" id="next-btn">⏭</button>
        </div>

        <ul id="playlist"></ul>
    </div>

    <script>
        const songs = [
            { name: "Rammstein — Deutschland", file: "2.mp3" },
            { name: "Нікіта Кисельов — Крила Лелеки", file: "1.mp3" },
        ];

        const playlist = document.getElementById('playlist');
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentTitle = document.getElementById('current-title');
        
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');

        let currentTrackIndex = 0;

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: songs[currentTrackIndex].name,
                    artist: "Мій Плеєр"
                });

                navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
                navigator.mediaSession.setActionHandler('play', playPause);
                navigator.mediaSession.setActionHandler('pause', playPause);
                
                // Вимикаємо дії перемотки 10 секунд для системного віджету iOS/Android
                navigator.mediaSession.setActionHandler('seekbackward', null);
                navigator.mediaSession.setActionHandler('seekforward', null);
            }
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            audio.src = songs[index].file;
            currentTitle.textContent = songs[index].name;
            
            const items = playlist.querySelectorAll('li');
            items.forEach((li, i) => {
                li.classList.toggle('active', i === index);
            });

            updateMediaSession();
        }

        function playPause() {
            if (audio.paused) {
                audio.play();
                playBtn.textContent = '⏸';
            } else {
                audio.pause();
                playBtn.textContent = '▶';
            }
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % songs.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playBtn.textContent = '⏸';
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + songs.length) % songs.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playBtn.textContent = '⏸';
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${progressPercent}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const width = progressContainer.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            if (duration) {
                audio.currentTime = (clickX / width) * duration;
            }
        });

        songs.forEach((song, index) => {
            const li = document.createElement('li');
            li.textContent = song.name;
            li.addEventListener('click', () => {
                loadTrack(index);
                audio.play();
                playBtn.textContent = '⏸';
            });
            playlist.appendChild(li);
        });

        playBtn.addEventListener('click', playPause);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        audio.addEventListener('ended', nextTrack);

        if (songs.length > 0) {
            loadTrack(0);
        }
    </script>
</body>
</html>
